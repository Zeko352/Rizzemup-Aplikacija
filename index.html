<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>RizzEmUp Premium</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap');
    body {
      font-family: 'Rubik', sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .app {
      background-color: rgba(255,255,255,0.1);
      padding: 40px; border-radius: 25px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      max-width: 600px; width: 100%; text-align: center;
      transition: 0.3s;
    }
    .app:hover { box-shadow: 0 0 40px rgba(255, 255, 255, 0.5); }
    h1 { font-size: 2.5rem; margin-bottom: 30px; color: #ffd700; }
    select, input, button {
      margin: 10px; padding: 12px 20px;
      font-size: 1rem;
      border-radius: 8px; border: none; outline: none;
      width: 80%; max-width: 300px;
    }
    button {
      background-color: #ff4d6d; color: white; cursor: pointer; transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    button:hover { background-color: #e63946; transform: translateY(-2px); }
    #rizz-text { margin-top: 20px; font-size: 1.3rem; min-height: 60px; color: #f1faee; }
    .hidden { display: none; }
    .section { margin-top: 25px; }
    #limit-message { color: #ffa500; font-weight: bold; }
    #history {
      text-align: left; margin-top: 15px;
      max-height: 150px; overflow-y: auto;
      padding: 10px; background-color: rgba(255,255,255,0.1); border-radius: 10px;
    }
    #history div {
      margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .rizz-list { padding: 10px; margin-top: 20px; background: rgba(255,255,255,0.2); border-radius: 12px; }
    .rizz-item { margin: 5px 0; color: #e3e3e3; cursor: pointer; transition: 0.3s; }
    .rizz-item:hover { color: #ff4d6d; }
  </style>
</head>
<body>
  <div class="app">
    <h1>RizzEmUp Premium</h1>
    <div id="step-login">
      <input id="username" placeholder="Vpiši ime..." />
      <button onclick="login()">Prijava</button>
    </div>
    <div id="step-language" class="hidden">
      <p>Izberi jezik:</p>
      <select id="language-select">
        <option value="sl">Slovenščina</option>
        <option value="en">English</option>
        <option value="sh">Srbohrvaščina</option>
      </select>
      <button onclick="chooseLanguage()">Naprej</button>
    </div>
    <div id="step-gender" class="hidden">
      <p id="gender-label"></p>
      <select id="gender-select">
        <option value="male">Moški</option>
        <option value="female">Ženska</option>
      </select>
      <button onclick="chooseGender()">Potrdi</button>
    </div>
    <div id="step-rizz" class="hidden">
      <div id="rizz-text">Klikni za rizz.</div>
      <button id="rizz-btn" onclick="showRizz()">Zrizaj</button>
      <div id="limit-message"></div>
      <div class="section">
        <input id="custom-rizz" placeholder="Dodaj svoj rizz..." />
        <button onclick="addCustomRizz()">Dodaj rizz</button>
      </div>
      <div class="rizz-list" id="rizz-list"></div>
      <div class="section">
        <h3>Tvoja zgodovina:</h3>
        <div id="history"></div>
      </div>
    </div>
  </div>

  <script>

          "Tvoj smeh? Osvojil me je", "Z vedno novo svežino izgledaš neverjetno", "Kralj, danes vladaš", "Tvoja prisotnost je naravnost magična", "Resnično car si", "Mojster stila si", "Vse se vrti okoli tebe"
        ],
        female: [
          "Hej kraljica, tvoj nasmeh osvetli ves dan", "Lepota tebe se meri v zvezdah", "Si kot jutranja kava – močna in nepogrešljiva", "Oči kot galaksije, resno", "Ti si razlog, da se dan začne s stilom", "Tvoja energija dvigne vse okoli tebe",
          "Tvoje besede so vedno prava izbira", "Tvoj stil je neprekosljiv", "Tvoj nasmeh me vedno spravi v dobro voljo", "Izžarevaš tako neverjetno pozitivnost", "Tvoje oči so kot morje", "Obožujem tvojo samozavest", "Tvoj korak je kot ples",
          "Vsi te opazijo, ko stopiš v prostor", "Ti si ta energija, ki jo potrebujemo", "Naravna lepota v vsakem pogledu", "Tvoj glas je kot glasba za moje ušesa", "Tvoj nasmeh je najlepši del dneva", "Nikoli ne prenehaš presenečati", "Tvoj šarm je brez primere"
        ]
      },
      en: {
        male: [
          "Hey king, you're the main character today", "You're not just a vibe, you're the whole energy", "Is that charm in human form?", "Bro, you're built different", "Your drip's making waves", "You're walking confidence",
          "Seriously, you're out here shining", "You're a walking inspiration", "Your style? It's impeccable", "When you walk in, the room lights up", "You're a complete package", "Your energy is unmatched", "Bro, you're on fire today", 
          "You're the definition of swag", "Your presence is magnetic", "Confidence is your middle name", "That outfit? Absolute fire", "You're the one people talk about", "Unstoppable force", "You're a legend in the making"
        ],
        female: [
          "Hey queen, your energy is magnetic", "You're slaying without even trying", "You light up every room you enter", "You're elegance and fire in one", "Glow up level: divine", "Beauty + brains? Unstoppable",
          "You're an icon", "You're a masterpiece", "You own the room", "That smile of yours is everything", "You redefine what elegance means", "You're the moment", "Your vibe is all I need", "People can't take their eyes off you", 
          "Everything about you is grace", "You're on another level", "You're setting the bar high", "Beauty and confidence, that's you", "You are the standard", "Effortlessly flawless"
        ]
      },
      sh: {
        male: [
          "Ej brate, ti si danas hit", "Harizmu sipaš kao niko", "Izgledaš kao milion dolara", "Kralj si, bez konkurencije", "Ti si glavni lik danas", "Brate, aura ti je ludilo",
          "Kada kročiš, svi gledaju", "Tvoj stil je nepogrešiv", "Svuda gdje ideš ostavljaš trag", "Tvoj osmijeh obara s nogu", "Tvoja energija je nevjerojatna", "Brate, izgledaš previše dobro", "Svaka tvoja odluka je hit", 
          "Kao filmski lik", "Stil koji nosiš je bez premca", "Kralj među svim ljudima", "Vodiš, ne slijediš", "Tvoje prisustvo je snažno", "Zavodiš na svakom koraku", "Tvoja aura je nevjerojatna"
        ],
        female: [
          "Ej ljepotice, ti sijaš jače od sunca", "Ti si čista poezija", "Izgledaš kao san koji hoda", "Osmijeh ti obara s nogu", "Svjetliš kao zvezda padalica", "Ti si definicija šarma",
          "Tvoj glas je kao pjesma", "S tobom je svaki trenutak čarolija", "Izgledaš kao da si izašla iz bajke", "Oči su ti kao dva dijamanta", "Puno si više od samo ljepote", "Zračiš pozitivnošću", "Tvoje prisustvo je moćno", 
          "Tvoj šarm ne može se ignorirati", "Tvoje oči? Najlepše na svetu", "Svuda gdje se pojaviš, svi zastanu", "Tvoj osmijeh je magičan", "Ti si uvijek u centru pažnje", "Zavodiš svojim pogledom", "Bajkovita si"
        ]
      }
    };

    let selectedLanguage = 'sl';
    let selectedGender = 'male';
    let username = '';
    const MAX_RIZZ = 3;

    const todayKey = () => {
      const d = new Date();
      return 'rizz_' + username + '_' + d.toISOString().split('T')[0];
    };

    function login() {
      username = document.getElementById("username").value.trim();
      if (username) {
        document.getElementById("step-login").classList.add("hidden");
        document.getElementById("step-language").classList.remove("hidden");
      }
    }

    function chooseLanguage() {
      selectedLanguage = document.getElementById("language-select").value;
      document.getElementById("step-language").classList.add("hidden");
      document.getElementById("step-gender").classList.remove("hidden");

      const prompts = {
        sl: "Izberi svoj spol:",
        en: "Select your gender:",
        sh: "Odaberi pol:"
      };
      document.getElementById("gender-label").innerText = prompts[selectedLanguage];
    }

    function chooseGender() {
      selectedGender = document.getElementById("gender-select").value;
      document.getElementById("step-gender").classList.add("hidden");
      document.getElementById("step-rizz").classList.remove("hidden");

      const btnText = {
        sl: selectedGender === "male" ? "Zrizajjo!" : "Zrizajga!",
        en: selectedGender === "male" ? "Rizz her!" : "Rizz him!",
        sh: selectedGender === "male" ? "Zrizaj je!" : "Zrizaj ga!"
      };
      document.getElementById("rizz-btn").innerText = btnText[selectedLanguage];

      refreshHistory();
    }

    function getTodayHistory() {
      return JSON.parse(localStorage.getItem(todayKey()) || "[]");
    }

    function saveToHistory(rizz) {
      const history = getTodayHistory();
      history.push(rizz);
      localStorage.setItem(todayKey(), JSON.stringify(history));
    }

    function refreshHistory() {
      const historyDiv = document.getElementById("history");
      const history = getTodayHistory();
      historyDiv.innerHTML = history.map(r => `<div>- ${r}</div>`).join('');
    }

    function showRizz() {
      const history = getTodayHistory();
      const messages = {
        sl: "Dosegel si dnevno mejo. Nadgradi na premium!",
        en: "You reached your daily limit. Upgrade to premium!",
        sh: "Prešao si dnevni limit. Kupi premium!"
      };

      if (history.length >= MAX_RIZZ) {
        document.getElementById("limit-message").innerText = messages[selectedLanguage];
        return;
      }

      const rizzList = rizzData[selectedLanguage][selectedGender];
      const rizz = rizzList[Math.floor(Math.random() * rizzList.length)];
      document.getElementById("rizz-text").innerText = rizz;
      document.getElementById("limit-message").innerText = "";
      saveToHistory(rizz);
      refreshHistory();
    }

    function addCustomRizz() {
      const custom = document.getElementById("custom-rizz").value.trim();
      if (custom) {
        saveToHistory(custom);
        refreshHistory();
      }
    }
  </script>
</body>
</html>
